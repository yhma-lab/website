# yaml-language-server: $schema=https://www.schemastore.org/pnpm-workspace.json

# autoDedupe: true

# lockfile:
#   includeResolutionSettings: true

packages:
  - packages/*
  - sites/*

allowBuilds:
  '@astryxdesign/cli': true
  '@astryxdesign/core': true
  '@swc/core': true
  esbuild: true
  msw: false
  protobufjs: false
  workerd: false

catalog:
  typescript: 'npm:@typescript/typescript6@^6.0.2'
  '@typescript/native': 'npm:typescript@^7.0.2'
  '@types/node': ^26.6.2

  react: ^19.3.1
  react-dom: ^19.3.1
  react-aria-components: ^1.22.0
  react-server-dom-webpack: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0

  waku: ^1.0.0-rc.3
  '@stylexjs/stylex': ^0.19.1
  '@stylexjs/babel-plugin': ^0.19.1
  '@stylexjs/unplugin': ^0.19.1
  browserslist: ^4.29.3
  lightningcss: ^1.33.0

  vite: ^8.3.0
  '@vitejs/plugin-react': ^6.1.2
  '@vitejs/plugin-rsc': ^0.5.38
  '@rolldown/plugin-babel': ^0.2.4

  fumadocs-core: ^16.17.3
  fumadocs-mdx: ^15.4.7
  katex: ^0.19.0
  rehype-katex: ^7.0.1
  remark-math: ^6.0.0
  '@types/mdx': ^2.0.14

  zod: ^4.6.5
  eslint: ^10.12.0

overrides:
  'es-set-tostringtag': 'npm:@nolyfill/es-set-tostringtag@^1'
  'hasown': 'npm:@nolyfill/hasown@^1'
  'safe-buffer': 'npm:@nolyfill/safe-buffer@^1'
  'side-channel': 'npm:@nolyfill/side-channel@^1'
