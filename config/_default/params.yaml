# SITE SETUP
# Guide: https://docs.hugoblox.com/getting-started/customize/
# Documentation: https://docs.hugoblox.com/

# Appearance

appearance:
  mode: system
  font: native
  font_size: L

# Site header

header:
  navbar:
    enable: true
    blox: 'navbar'
    show_logo: true
    show_language: false
    show_theme_chooser: true
    show_search: false
    highlight_active_link: true

# Site footer

footer:
  widget: minimal
  copyright:
    notice: '© {year} yhma lab. This site is licensed under {license}'
    license:
      enable: true
      allow_derivatives: true
      share_alike: true
      allow_commercial: false

# Localization

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features

features:
  # syntax_highlighter:
  #   theme_light: github-light
  #   theme_dark: dracula
  math:
    enable: true
  repository:
    url: 'https://github.com/yhma-lab/website'
    content_dir: content
    branch: hugo
  avatar:
    gravatar: true
    shape: circle
  privacy_pack:
    enable: true

# Extensions

extensions:
  academicons:
    enable: true

# Security

security:
  # Allow frame for embedding speaker notes in slides
  allow_frame: false
  permissions:
    policy: >-
      accelerometer=(), camera=(), geolocation=(), gyroscope=(),
      magnetometer=(), microphone=(), payment=(), usb=()

# SEO

marketing:
  seo:
    site_type: 'ResearchOrganization'
    # local_business_type: '' # https://schema.org/LocalBusiness#subtypes
    description: "Yuhan Ma's personal resume and detail infomation about his research group"
  verification:
    google: ''
    baidu: ''
    bing: ''
  analytics:
    # google_analytics: ''
    # microsoft_clarity: 'YOUR_ID'
    # plausible: 'YOUR_ID'
